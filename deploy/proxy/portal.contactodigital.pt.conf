server {
    listen 80;
    server_name portal.contactodigital.pt www.portal.contactodigital.pt;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://portal.contactodigital.pt$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name portal.contactodigital.pt www.portal.contactodigital.pt;

    ssl_certificate /etc/letsencrypt/live/portal.contactodigital.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.contactodigital.pt/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://contacto_digital_portal_web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
