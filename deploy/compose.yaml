services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: contacto-digital-portal-app:latest
    container_name: contacto_digital_portal_app
    environment:
      SQLITE_RUNTIME_DATABASE: /var/www/shared/database/contacto_runtime.sqlite
    env_file:
      - .env.production
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./shared/storage:/var/www/html/storage
      - ./shared/database:/var/www/shared/database
    networks:
      - internal
      - proxy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  web:
    image: nginx:alpine
    container_name: contacto_digital_portal_web
    depends_on:
      - app
    volumes:
      - ./app-runtime:/var/www/html:ro
      - ./shared/storage:/var/www/html/storage
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - internal
      - proxy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: contacto-digital-portal-app:latest
    container_name: contacto_digital_portal_worker
    environment:
      SQLITE_RUNTIME_DATABASE: /var/www/shared/database/contacto_runtime.sqlite
    depends_on:
      - app
    command: php -d memory_limit=384M artisan queue:work --sleep=3 --tries=1 --timeout=0
    env_file:
      - .env.production
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./shared/storage:/var/www/html/storage
      - ./shared/database:/var/www/shared/database
    networks:
      - internal
      - egress
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  scheduler:
    image: contacto-digital-portal-app:latest
    container_name: contacto_digital_portal_scheduler
    environment:
      SQLITE_RUNTIME_DATABASE: /var/www/shared/database/contacto_runtime.sqlite
    depends_on:
      - app
    command: php artisan schedule:work --no-interaction
    env_file:
      - .env.production
    volumes:
      - ./shared/storage:/var/www/html/storage
      - ./shared/database:/var/www/shared/database
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 128

  # PERF-501 (fase 1): container adicionado, mas ainda NÃO ligado ao `app`
  # (nem depends_on, nem DB_CONNECTION aponta para aqui). Fica pronto para
  # a fase 3 (corte de produção), depois de o VPS ser redimensionado — ver
  # docs/PLANO_DE_PERFORMANCE_SINCRONIZACAO.md (PERF-501). Memória e
  # concorrência tunadas para um host modesto, não os valores por omissão
  # do Postgres (pensados para servidores dedicados maiores).
  postgres:
    image: postgres:17-alpine
    container_name: contacto_digital_portal_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contacto_digital_portal}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
    volumes:
      - portal_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  internal:
    name: contacto-digital-portal-internal
    internal: true
  egress:
    name: contacto-digital-portal-egress
  proxy:
    external: true
    name: proxy_default

volumes:
  portal_postgres_data:
    name: contacto-digital-portal-postgres-data
