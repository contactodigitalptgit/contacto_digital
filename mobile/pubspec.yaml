name: contacto_digital_mobile
description: "App do cliente para acompanhar o seu evento em tempo real (Contacto Digital)."
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo-contacto-digital.webp
  adaptive_icon_background: "#041B2D"
  adaptive_icon_foreground: assets/images/logo-contacto-digital.webp
  remove_alpha_ios: true
  background_color_ios: "#041B2D"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo-contacto-digital.webp
